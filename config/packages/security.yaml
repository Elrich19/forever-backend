security:
    password_hashers:
        App\Entity\Distributeur:
            algorithm: auto

    providers:
        app_distributeur_provider:
            entity:
                class: App\Entity\Distributeur
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        register:
            pattern: ^/api/auth/register
            stateless: true
            security: false

        login:
            pattern: ^/api/auth/login
            stateless: true
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: motDePasse
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        public:
            pattern: ^/api/site
            stateless: true
            security: false

        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    access_control:
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/site, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_DISTRIBUTEUR }

when@test:
    security:
        password_hashers:
            App\Entity\Distributeur:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
